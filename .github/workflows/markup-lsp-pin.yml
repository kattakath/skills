name: markup-lsp-pin

# markup-lsp's flake.lock is bumped by hand to follow nix-config's nixpkgs pin (the plugin
# README says why no bot). This is the watcher for that hand step, and it must reach a human:
#   - pins differ   -> open ONE issue, assigned (or comment once when the revs change)
#   - pins match    -> close that issue
#   - check broken  -> this run FAILS (GitHub notifies per the schedule owner's Actions
#                      notification settings)
#
# Why a schedule and not a step in validate: the lag is created by nix-config's weekly
# update-flake-lock PR (Mondays 04:23 UTC, merged whenever its CI passes), not by a push
# here, so a check that runs only on skills pushes would wait for an unrelated push. Why
# DAILY rather than weekly: that PR's merge time varies, and a Monday-only run that fires
# before the merge would miss the lag by a week. A run that finds nothing to do costs one
# API read and posts nothing.
#
# Why an issue and not ci-watch: ci-watch only wakes a session on pushes it watched, so
# carrying warnings in its GREEN line would still miss a lag that no push here creates.

on:
  schedule:
    - cron: "37 9 * * *" # off the hour: GitHub delays and may drop runs queued at :00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: markup-lsp-pin
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kattakath/nix-config
          ref: main
          path: .nix-config
          persist-credentials: false

      # lock-parity.py exit codes: 0 match, 3 lag, anything else a broken check, which fails
      # here so the keeper never runs on a check that measured nothing.
      - name: Compare pins
        id: parity
        run: |
          rc=0
          msg=$(python3 -I plugins/markup-lsp/tests/lock-parity.py .nix-config/flake.lock) || rc=$?
          echo "$msg"
          case "$rc" in
            0) echo "state=ok" >>"$GITHUB_OUTPUT" ;;
            3) echo "state=problem" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::lock-parity.py failed (exit $rc); the pin watcher is blind"; exit 1 ;;
          esac
          { echo "msg<<EOF_MSG"; echo "$msg"; echo "EOF_MSG"; } >>"$GITHUB_OUTPUT"

      # The fleet's ONE issue-keeper (kattakath/.github, pinned by sha; its cases run there).
      # It assigns only a User account: a bot-opened issue notifies only repo watchers, and
      # github.triggering_actor resolves to a bot on scheduled runs (measured by nix-config).
      # assignee-id is the operator's immutable account id, read from the kattakath org
      # variable OPERATOR_ID (declared in nix-config's terranix from its identity). Unset, it
      # reads as "" and the issue opens unassigned. The title must stay byte-identical, or
      # the next run opens a duplicate.
      - uses: kattakath/.github/actions/issue-keeper@3a1a3c59c92aa76e77d52e52313499182feb4864 # v1.0.0
        with:
          title: "markup-lsp: nixpkgs pin lags nix-config"
          state: ${{ steps.parity.outputs.state }}
          body: ${{ steps.parity.outputs.msg }}
          assignee-id: ${{ vars.OPERATOR_ID }}
