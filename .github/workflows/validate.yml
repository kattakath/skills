name: validate

# A merge to main is a release: each plugin carries a semver `version` that the
# `Plugin version bumped` step forces up on every change, and auto-update ships it.
# This is the gate in front of that.
#
# Manifest/schema validation is delegated to Anthropic's own reusable action —
# anthropics/claude-plugins-community/.github/actions/validate-plugins, "designed
# to be dropped into any *-plugins repo unchanged" (its README). It runs
# `claude plugin validate` (the same check this used to shell out to by hand)
# PLUS security/policy invariants I1-I11 this repo never checked on its own:
# alpha-sorted entries, no duplicate names, https-only sources, a required
# SHA-pin on any externally-sourced plugin, no shell metacharacters or hidden
# Unicode in names/descriptions.
#
# `claude-cli-version` IS PINNED, and stays pinned. Leaving it at "latest" imported an
# upstream policy change unannounced on 2026-10-02 and broke EVERY open PR at once: the
# CLI grew a reserved-name rule and rejected
#   plugins[].name "claude-code-nix" is reserved: it passes as one of Anthropic's own
# The rule was correct, so the plugin was RENAMED to `nix-flake-kit` (2026-11-01) and the
# pin raised from that tourniquet (2.1.268) to a current CLI. Raise it deliberately, on a
# PR of its own, so a new validator rule shows up as one red PR rather than all of them.
#
# The argument for "latest" was that Anthropic's own claude-plugins-official repo does
# it. That argument is sound for THEIR repo and was wrong here: they own the reserved
# namespace, so a rule about impersonating it can never fire against them. We inherit
# their CI policy and their adversary at once. This repo has no externally-sourced
# plugins today, so the clone-and-validate-external step is a no-op; leaving it
# enabled costs nothing and future-proofs the day one is added.

#
# ONE FULL RUN PER PR. The required check is `gate`, not `validate`. `gate` always runs and
# asserts that each job it `needs` ended EXACTLY as this event expects. The full `validate`
# suite runs once: in the merge queue when the repo variable QUEUE_ENABLED is 'true', otherwise
# on the PR. Fork PRs always get it on the PR too, so a contributor sees a real failure before
# review instead of a queue ejection only a maintainer can retry. `quick` gives own-branch PRs an
# early red on the cheapest common failures. Measured before this change, on the last 40 runs:
# `validate` ran twice per PR (pull_request ~96 s, then push:main ~101 s on the same tree).
#
# Why an aggregator: "A job that is skipped will report its status as Success", and a dependent
# job skipped after a failure "may not block merging" (GitHub docs). So a skipped job must
# never BE the required check. Prior art: indexmap, DeterminateSystems/magic-nix-cache-action.
#
# The `push: main` leg is for the operator's direct pushes (admin bypass), which skip the queue.
# It reports a bad push AFTER it shipped (a push to main is the release); that is the accepted
# trade for not opening a PR. Queue merges also run it once more on main. release-tags.yml keeps
# its own push:main trigger.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # The operator's own changes land by direct push (admin bypass), not via a PR, so this
  # is the only check they get. The kattakath/skills `ci-watch` plugin waits on it.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  # Supersede stale PR runs; never cancel a queue run (the queue would eject the PR).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Not required. The cheap checks behind the most common red, on every PR.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plugin version bumped
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I scripts/check-version-bump.py "origin/$BASE_REF"
      - name: Runner specs pinned
        run: python3 -I scripts/check-pins.py
      - name: Index up to date
        run: python3 scripts/build-index.py --check

  # THE ONLY REQUIRED CHECK. Its job name is part of every ruleset; never rename it.
  gate:
    if: ${{ !cancelled() }}
    needs: [quick, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Shared assertion (kattakath/.github). `expect` holds a deliberate SECOND copy of
      # `validate`'s `if:`; if the two ever disagree, gate goes red in both directions, so a
      # bad edit fails closed instead of quietly skipping the suite.
      - uses: kattakath/.github/actions/gate@60981e562aec38c13e15be1b6307b23a42f5b8d3
        with:
          needs: ${{ toJSON(needs) }}
          expect: >-
            {"quick": ${{ github.event_name == 'pull_request' }},
             "validate": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }}}

  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate marketplace and plugins
        uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@a727be1c7bd6064419b6f60d71993a19198adc17
        with:
          marketplace-path: .claude-plugin/marketplace.json
          # See the header: pinned on purpose; raise it on a PR of its own.
          claude-cli-version: 2.1.296

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # A plugin script never runs at install time, so a syntax error would ship
      # silently and only surface mid-session.
      - name: Scripts parse
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; rc=1; }
          done < <(find plugins \( -name '*.js' -o -name '*.mjs' \) -print0)
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bad shell syntax"; rc=1; }
          done < <(find plugins -name '*.sh' -print0)
          exit $rc

      # The safety-floor hooks (superhook, nix-flake-kit, brain-signals) are typed against
      # Anthropic's OWN hook types: JSDoc `import('@anthropic-ai/claude-agent-sdk')` typedefs,
      # checked by tsc. Parsing cannot see a typo'd `decision`/`permissionDecision` value or a
      # payload field the harness never sends; this can (a `"aprove"` fails with TS2367).
      #
      # Types only — the scripts still run with plain `node` and no node_modules. The SDK is a
      # devDependency in the root package.json, and the grep fails any plugin script that
      # `require`s or `import`s it at run time.
      #
      # Pins, all exact, from package-lock.json via `npm ci` (integrity-checked):
      #   - claude-agent-sdk 0.3.296: its `claudeCodeVersion` is 2.1.296, the same CLI the
      #     validator above is pinned to. Raise the two together.
      #   - typescript 6.0.3: the last JavaScript tsc. 7.x is native and arrives as an
      #     optionalDependency (@typescript/typescript-<platform>), which --omit=optional drops.
      #   - --omit=optional is load-bearing: the SDK's optionalDependencies are its native CLI
      #     binaries, ~290 MB unpacked each (measured: the linux-x64 one), and tsc needs none.
      - name: Hook scripts type-check
        run: |
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
          npx --no-install tsc -p tsconfig.hooks.json
          if grep -rnE "(require\(|from |import\()['\"]@anthropic-ai/claude-agent-sdk" plugins --include='*.js' --include='*.mjs' | grep -v '@typedef'; then
            echo "::error::a plugin script loads the Agent SDK at run time; types must stay in JSDoc"
            exit 1
          fi

      # `node --check` CANNOT SEE THE FAILURE THAT ACTUALLY MATTERS HERE. A workflow script
      # whose `export const meta = {...}` literal is not the FIRST statement is perfectly valid
      # JavaScript and loads as ZERO workflows — measured: `Total plugin workflows loaded: 0`
      # with no error line emitted at all. So a parse-only step would go green over a dead file,
      # which is the one shape this repo's own silent-instruments catalogue exists to reject.
      #
      # The `n >= 1` floor is here for the same reason the Nix step's floor is (#54): rename or
      # move workflows/ later and a floorless step iterates zero files and still exits 0.
      #
      # Known limitation: a workflow legitimately opening with a /* block comment */ would
      # false-red. Anthropic's own claude-security/workflows/scan.js opens with `export const
      # meta={` on line 1, so the convention holds; widen the check rather than dropping it.
      - name: Plugin workflows load-shape
        run: |
          rc=0
          n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            node --check "$f" || { echo "::error file=$f::does not parse"; rc=1; }
            first=$(sed -e 's,//.*,,' "$f" | grep -m1 -v '^[[:space:]]*$')
            case "$first" in
              'export const meta'*) : ;;
              *) echo "::error file=$f::meta literal must be the FIRST statement (got: $first)"; rc=1 ;;
            esac
          done < <(find plugins -path '*/workflows/*' -name '*.js' -print0)
          if [ "$n" -lt 1 ]; then
            echo "::error::expected at least 1 plugin workflow, found $n" >&2
            rc=1
          fi
          echo "checked $n workflow(s)"
          exit $rc

      # SAME REASONING AS "Scripts parse", for the one language that step cannot see.
      # `nix-dev-toolkit`'s flake template is ~400 lines of Nix that nothing in this
      # repo ever evaluated: the step above globs *.js/*.mjs/*.sh, and the Anthropic
      # validator checks manifest schemas, not asset contents. So a stray quote would
      # have shipped on merge — the marketplace auto-updates with no pin — and been
      # discovered mid-conquest, in someone else's repo, by an agent that had just
      # copied it in. The file's OWN comments warn about the `''` hazard three times
      # and record having hit it once.
      #
      # Parse, not evaluate. These are TEMPLATES: they carry `# ADAPT` markers and
      # reference a sibling that only exists once copied, so `nix flake check` cannot
      # work here. `nix-instantiate --parse` is the strongest gate the artefact shape
      # allows, and it is the one that catches the failure that actually happened.
      #
      # ubuntu-24.04 ships no Nix, so the parse step needs an installer. Pinned to the
      # same SHA nix-config's own CI uses, so the two repos cannot drift onto different
      # installers.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Nix assets parse
        run: |
          rc=0
          n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            nix-instantiate --parse "$f" >/dev/null \
              || { echo "::error file=$f::does not parse"; rc=1; }
          done < <(find plugins -name '*.nix' -print0)
          # A gate that silently covers nothing is the failure #54 existed to fix. If the
          # assets are ever moved or renamed, this says so instead of going green over zero
          # files. Raise the floor when a second plugin ships Nix; do not delete it.
          if [ "$n" -lt 2 ]; then
            echo "::error::expected at least 2 .nix assets under plugins/, found $n" >&2
            rc=1
          fi
          echo "parsed $n Nix asset(s)"
          exit $rc

      # The negative fixtures matter most: a validator that cannot reject anything
      # is decoration.
      - name: page-lab envelope self-test
        run: node plugins/page-lab/scripts/pick-validate.mjs --self-test plugins/page-lab/scripts/fixtures

      # block@1 / profile@1 fixtures both ways, the no-evasion argv, the gate's detectors and its
      # run state. The live-browser half skips (loudly) unless PAGE_LAB_CHROME names a browser.
      - name: page-lab cases
        run: node --test plugins/page-lab/tests/*.test.mjs

      # nix-flake-kit's hooks are part of nix-config's always-on safety floor, so both halves
      # are pinned: autostage must stage (worktrees and nested repos included) and must never
      # run a shell or reach outside the project; the lint must flag and must stay quiet.
      # The autostage cases ask git what was staged, so they need git, not just node.
      - name: nix-flake-kit hook cases
        run: node --test plugins/nix-flake-kit/tests/*.test.js

      - name: mac-app-send guard cases
        run: bash plugins/mac-app-send/tests/guard-cases.sh

      # The script's own cases run gpg against throwaway keys with a file-backed clipboard.
      # zsh is the script's interpreter and is not on the ubuntu image; gnupg is.
      - name: pgp-ops script cases
        run: |
          command -v zsh >/dev/null || sudo apt-get install -y -qq zsh >/dev/null
          bash plugins/pgp-ops/tests/script-cases.sh

      # The Senate hands web-derived lane reports to a synthesis agent. Two things keep that
      # safe and NEITHER is visible to any other gate: the synthesis agentType (empire:consul,
      # Read/Grep/Glob only) and a fence that makes the payload markers unforgeable.
      #
      # The first fence shipped FORGEABLE — `JSON.stringify` escapes quotes and newlines but not
      # arbitrary ASCII, so a lane report could emit the END marker verbatim and everything after
      # it read as though the script had written it. That shipped to `main` in #68 before it was
      # caught. This step is why it cannot ship again.
      #
      # The test reads the fence and the markers OUT of senate.js rather than re-declaring them,
      # so a weakened fence fails here instead of leaving a stale copy green.
      - name: empire senate fence cases
        run: node plugins/empire/tests/senate-fence-cases.mjs

      - name: skill-curator usage cases
        run: bash plugins/skill-curator/skills/skill-curator/tests/usage-cases.sh

      # statement-extract's frozen key normalisers are a contract with stored data: a key that
      # changes bytes silently duplicates every downstream row. run.sh pins them with golden
      # vectors made BY the legacy extractor itself, a source hash per normaliser, and an exact
      # stdout golden per synthetic fixture, plus count floors so a moved directory cannot pass
      # as zero cases. System python3 only (3.12 here): the plugin is stdlib-only by design.
      - name: statement-extract cases
        run: bash plugins/statement-extract/tests/run.sh

      # The PDF adapters read text through poppler's `pdftotext -layout`, an external binary
      # the unit suite never touches (its fixtures are text). This step generates PDFs in-run
      # from those fixtures, so no PDF is ever committed, and requires poppler to read them
      # back into the same records. Same apt pattern as the pgp-ops step.
      - name: statement-extract pdf reader smoke
        run: |
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null
          bash plugins/statement-extract/tests/run.sh --pdf-smoke

      # plaid-pfc pins Plaid's taxonomy as data; the suite checks the pin's counts, strict
      # refusal of an invented name, the crosswalk and the JSON Schema enum. Stdlib only, no
      # network: refresh is tested on a synthetic CSV.
      - name: plaid-pfc cases
        run: bash plugins/plaid-pfc/tests/run.sh

      # beancount's builder is checked by Beancount itself: every golden must load with zero
      # errors, and a wrong balance must refuse. That needs beancount importable, so this step
      # makes a venv with the versions the plugin is tested at (cp312 manylinux wheels exist
      # for both, so nothing compiles). The suite has a test-count floor, like the others.
      - name: beancount cases
        run: |
          python3 -m venv /tmp/bk
          /tmp/bk/bin/pip install -q beancount==3.2.3 beanquery==0.2.0 smart-importer==1.2
          PYTHON=/tmp/bk/bin/python bash plugins/beancount/tests/run.sh

      # Plugins carry a semver `version`; an installed copy updates only when it changes.
      # A plugin change without a bump would therefore reach nobody, silently. This makes it red.
      # In the queue the base is the merge group's base commit; on a PR it is the target branch;
      # on a push it is the commit main held before (`event.before`). Only on push: a PR's
      # `before` is its previous HEAD, which would weaken the check.
      - name: Plugin version bumped
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ (github.event_name == 'push' && github.event.before) || github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          python3 -I scripts/check-version-bump.py --self-test
          python3 -I scripts/check-version-bump.py "$BASE_REF"

      # An unpinned `npx -y foo` / `uvx foo` ships whatever the registry serves today to
      # every user, with no PR here. Dependabot cannot see these specs (it reads manifests,
      # not .mcp.json args or shell launchers), so this gate is the only pin keeper.
      - name: Runner specs pinned
        run: |
          python3 -I scripts/check-pins.py --self-test
          python3 -I scripts/check-pins.py

      # rag and wordpress start a launcher the operator names (no fleet default). The cases
      # pin the precedence (setting > env) and that an unset one fails loud, not silent.
      - name: rag + wordpress launcher cases
        run: |
          bash plugins/rag/tests/launcher-cases.sh
          bash plugins/wordpress/tests/launcher-cases.sh

      # android-phone's android-chrome launcher makes an adb forward that serves the device's
      # logged-in Chrome as unauthenticated CDP on 127.0.0.1. The cases pin that every exit
      # (clean, crash, TERM/HUP, TERM mid-startup, SIGKILL then next session) leaves no
      # forward and no listener, against a fake adb that really binds the port.
      - name: android-phone launcher cases
        run: bash plugins/android-phone/tests/attach-cases.sh

      # brain-signals' Stop hook runs at the end of EVERY turn, so its must-stay-QUIET half
      # matters as much as the warnings, and a warning must never carry `decision` or
      # `additionalContext` (either one continues the turn on Stop — warn mode would block).
      - name: brain-signals stop-limbo cases
        run: bash plugins/brain-signals/tests/stop-limbo-cases.sh

      # Claude Code IGNORES frontmatter it does not recognise, so a plugin agent name that
      # does not resolve, an ignored agent key, or a drifted copy of the diagram width check
      # ships green. These static cases pin each one (the live width case skips here:
      # mermaid-ascii is not on the runner).
      - name: brain-signals shape cases
        run: bash plugins/brain-signals/tests/shape-cases.sh
      - name: brain-signals mermaid-hint cases
        run: bash plugins/brain-signals/tests/mermaid-hint-cases.sh
      # superhook sits in front of consumer GUARDS (nix-config's Bash guard and Stop gate),
      # so its failure mode is a guard that silently stops guarding. The cases pin that every
      # block passes through, a repeated PreToolUse deny is never downgraded, the wrapper
      # never synthesizes an allow, and each inner budget sits under its harness timeout.
      - name: superhook supervisor cases
        run: bash plugins/superhook/tests/supervisor-cases.sh

      # Both halves of silent-instruments, and they test different things. The lint
      # cases pin the hook's behaviour — including the must-stay-QUIET half, which
      # matters more than the flags: this hook is enabled in every repo, so a rule that
      # fires on ordinary work trains the reader to ignore the channel.
      - name: silent-instruments lint cases
        run: bash plugins/silent-instruments/tests/lint-cases.sh

      # ci-watch's halves: silent on green (empty stdout AND stderr), never green on zero,
      # late or cancelled runs, a resolved report on red, and a hook that asks GitHub nothing
      # for a non-push. `gh` is a fixture stub, so no network. The suite has a case floor.
      - name: ci-watch cases
        run: bash plugins/ci-watch/tests/run.sh

      # The trap cases assert the CATALOGUE, not the code: that each documented
      # instrument really does exit 0 having measured nothing, and that the named
      # replacement really does answer correctly. A trap that stops reproducing is an
      # entry to correct, not a test to delete — this suite already caught a wrong
      # mechanism in the catalogue's first draft. No network, no credentials; zsh cases
      # skip when zsh is absent.
      - name: silent-instruments trap cases
        run: bash plugins/silent-instruments/skills/silent-instruments/tests/trap-cases.sh

      # INDEX.md is generated; a route step that points at nothing, an entry no
      # route reaches, or a hand edit all fail here.
      - name: Index up to date
        run: python3 scripts/build-index.py --check
