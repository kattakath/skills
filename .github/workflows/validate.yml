name: validate

# Every commit on main is a release: plugins here carry no `version`, so Claude
# Code treats each commit SHA as a new version and auto-update ships it. This is
# the gate in front of that.
#
# Manifest/schema validation is delegated to Anthropic's own reusable action —
# anthropics/claude-plugins-community/.github/actions/validate-plugins, "designed
# to be dropped into any *-plugins repo unchanged" (its README). It runs
# `claude plugin validate` (the same check this used to shell out to by hand)
# PLUS security/policy invariants I1-I11 this repo never checked on its own:
# alpha-sorted entries, no duplicate names, https-only sources, a required
# SHA-pin on any externally-sourced plugin, no shell metacharacters or hidden
# Unicode in names/descriptions.
#
# `claude-cli-version` IS PINNED, 2026-10-02, and it was NOT before. Leaving it at
# "latest" imported an upstream policy change unannounced and broke EVERY open PR at
# once: the CLI grew a reserved-name rule and now rejects
#   plugins[].name "claude-code-nix" is reserved: it passes as one of Anthropic's own
# Last green `main`: 2026-10-01T04:02Z. #48, #49, #50 and #51 then failed identically,
# none of them having touched that plugin. CLI 2.1.268 accepts the marketplace; the
# newer one does not.
#
# THIS PIN IS A TOURNIQUET, NOT A FIX. The rule is correct — the name does read as
# Anthropic's — and the real repair is renaming `claude-code-nix`, which is a
# cross-repo change (nix-config's `alwaysOnNames` assertion, its guardrails'
# `mcp__plugin_claude-code-nix_nixos__nix` allow-rule, superhook's hook-by-convention
# resolution) and reinstallation for anyone holding it, since the plugin cache is keyed
# by name. Raising this pin before that rename re-breaks the repo.
#
# The argument for "latest" was that Anthropic's own claude-plugins-official repo does
# it. That argument is sound for THEIR repo and was wrong here: they own the reserved
# namespace, so a rule about impersonating it can never fire against them. We inherit
# their CI policy and their adversary at once. This repo has no externally-sourced
# plugins today, so the clone-and-validate-external step is a no-op; leaving it
# enabled costs nothing and future-proofs the day one is added.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate marketplace and plugins
        uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@a727be1c7bd6064419b6f60d71993a19198adc17
        with:
          marketplace-path: .claude-plugin/marketplace.json
          # See the header: pinned to the last version that accepts this marketplace.
          # Raise it only together with the `claude-code-nix` rename.
          claude-cli-version: 2.1.268

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A plugin script never runs at install time, so a syntax error would ship
      # silently and only surface mid-session.
      - name: Scripts parse
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; rc=1; }
          done < <(find plugins \( -name '*.js' -o -name '*.mjs' \) -print0)
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bad shell syntax"; rc=1; }
          done < <(find plugins -name '*.sh' -print0)
          exit $rc

      # `node --check` CANNOT SEE THE FAILURE THAT ACTUALLY MATTERS HERE. A workflow script
      # whose `export const meta = {...}` literal is not the FIRST statement is perfectly valid
      # JavaScript and loads as ZERO workflows — measured: `Total plugin workflows loaded: 0`
      # with no error line emitted at all. So a parse-only step would go green over a dead file,
      # which is the one shape this repo's own silent-instruments catalogue exists to reject.
      #
      # The `n >= 1` floor is here for the same reason the Nix step's floor is (#54): rename or
      # move workflows/ later and a floorless step iterates zero files and still exits 0.
      #
      # Known limitation: a workflow legitimately opening with a /* block comment */ would
      # false-red. Anthropic's own claude-security/workflows/scan.js opens with `export const
      # meta={` on line 1, so the convention holds; widen the check rather than dropping it.
      - name: Plugin workflows load-shape
        run: |
          rc=0
          n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            node --check "$f" || { echo "::error file=$f::does not parse"; rc=1; }
            first=$(sed -e 's,//.*,,' "$f" | grep -m1 -v '^[[:space:]]*$')
            case "$first" in
              'export const meta'*) : ;;
              *) echo "::error file=$f::meta literal must be the FIRST statement (got: $first)"; rc=1 ;;
            esac
          done < <(find plugins -path '*/workflows/*' -name '*.js' -print0)
          if [ "$n" -lt 1 ]; then
            echo "::error::expected at least 1 plugin workflow, found $n" >&2
            rc=1
          fi
          echo "checked $n workflow(s)"
          exit $rc

      # SAME REASONING AS "Scripts parse", for the one language that step cannot see.
      # `nix-dev-toolkit`'s flake template is ~400 lines of Nix that nothing in this
      # repo ever evaluated: the step above globs *.js/*.mjs/*.sh, and the Anthropic
      # validator checks manifest schemas, not asset contents. So a stray quote would
      # have shipped on merge — the marketplace auto-updates with no pin — and been
      # discovered mid-conquest, in someone else's repo, by an agent that had just
      # copied it in. The file's OWN comments warn about the `''` hazard three times
      # and record having hit it once.
      #
      # Parse, not evaluate. These are TEMPLATES: they carry `# ADAPT` markers and
      # reference a sibling that only exists once copied, so `nix flake check` cannot
      # work here. `nix-instantiate --parse` is the strongest gate the artefact shape
      # allows, and it is the one that catches the failure that actually happened.
      #
      # ubuntu-24.04 ships no Nix, so the parse step needs an installer. Pinned to the
      # same SHA nix-config's own CI uses, so the two repos cannot drift onto different
      # installers.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Nix assets parse
        run: |
          rc=0
          n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            nix-instantiate --parse "$f" >/dev/null \
              || { echo "::error file=$f::does not parse"; rc=1; }
          done < <(find plugins -name '*.nix' -print0)
          # A gate that silently covers nothing is the failure #54 existed to fix. If the
          # assets are ever moved or renamed, this says so instead of going green over zero
          # files. Raise the floor when a second plugin ships Nix; do not delete it.
          if [ "$n" -lt 2 ]; then
            echo "::error::expected at least 2 .nix assets under plugins/, found $n" >&2
            rc=1
          fi
          echo "parsed $n Nix asset(s)"
          exit $rc

      # The negative fixtures matter most: a validator that cannot reject anything
      # is decoration.
      - name: page-lab envelope self-test
        run: node plugins/page-lab/scripts/pick-validate.mjs --self-test plugins/page-lab/scripts/fixtures

      - name: mac-app-send guard cases
        run: bash plugins/mac-app-send/tests/guard-cases.sh

      # The Senate hands web-derived lane reports to a synthesis agent. Two things keep that
      # safe and NEITHER is visible to any other gate: the synthesis agentType (empire:consul,
      # Read/Grep/Glob only) and a fence that makes the payload markers unforgeable.
      #
      # The first fence shipped FORGEABLE — `JSON.stringify` escapes quotes and newlines but not
      # arbitrary ASCII, so a lane report could emit the END marker verbatim and everything after
      # it read as though the script had written it. That shipped to `main` in #68 before it was
      # caught. This step is why it cannot ship again.
      #
      # The test reads the fence and the markers OUT of senate.js rather than re-declaring them,
      # so a weakened fence fails here instead of leaving a stale copy green.
      - name: empire senate fence cases
        run: node plugins/empire/tests/senate-fence-cases.mjs

      - name: skill-curator usage cases
        run: bash plugins/skill-curator/skills/skill-curator/tests/usage-cases.sh

      # Both halves of silent-instruments, and they test different things. The lint
      # cases pin the hook's behaviour — including the must-stay-QUIET half, which
      # matters more than the flags: this hook is enabled in every repo, so a rule that
      # fires on ordinary work trains the reader to ignore the channel.
      - name: silent-instruments lint cases
        run: bash plugins/silent-instruments/tests/lint-cases.sh

      # The trap cases assert the CATALOGUE, not the code: that each documented
      # instrument really does exit 0 having measured nothing, and that the named
      # replacement really does answer correctly. A trap that stops reproducing is an
      # entry to correct, not a test to delete — this suite already caught a wrong
      # mechanism in the catalogue's first draft. No network, no credentials; zsh cases
      # skip when zsh is absent.
      - name: silent-instruments trap cases
        run: bash plugins/silent-instruments/skills/silent-instruments/tests/trap-cases.sh

      # INDEX.md is generated; a route step that points at nothing, an entry no
      # route reaches, or a hand edit all fail here.
      - name: Index up to date
        run: python3 scripts/build-index.py --check
