name: arm-dependabot

# Thin caller. Why Dependabot PRs are armed from a schedule: kattakath/.github's
# arm-dependabot.yml header.

on:
  schedule:
    # Off the hour: GitHub delays and drops scheduled runs at peak. Dispatch to arm at once.
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: arm-dependabot
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  arm:
    uses: kattakath/.github/.github/workflows/arm-dependabot.yml@60981e562aec38c13e15be1b6307b23a42f5b8d3
    with:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
