<!doctype html>
<meta charset="utf-8">
<title>lock fixture</title>
<style>body{font:16px sans-serif;margin:40px}button,input,a{font-size:18px;margin:8px}</style>
<h1>Lock fixture</h1>
<button id="btn" onclick="document.getElementById('n').textContent=Number(document.getElementById('n').textContent)+1">Click me</button>
<span>clicks: <b id="n">0</b></span>
<br><input id="txt" placeholder="type here" autocomplete="off">
<br><span>keys seen: <b id="k"></b></span>
<br><a id="next" href="second.html">go to second page</a>
<div style="height:3000px"></div>
<script>
  document.getElementById('txt').addEventListener('keydown', e => { document.getElementById('k').textContent += e.key + ' '; });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') document.title = 'page saw Escape'; });
</script>
