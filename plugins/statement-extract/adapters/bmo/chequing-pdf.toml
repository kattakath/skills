# BMO (Bank of Montreal) chequing (deposit account), CLOSED: its monthly PDF statements are
# the only source. BMO offered no QFX for it.
institution = "BMO"
format = "pdftext"
description = "BMO closed chequing account, monthly PDF statement"

[identify]
text = ['Bank of Montreal', 'Summary of your account', 'Chequing Account # \d{4} \d{4}-\d{3}',
        'from your account \(\$\)', '^\s*[A-Z][a-z]{2} \d{1,2}\s+Closing totals\s']

[keys]
# No FITID. Synthetic key, the same choice as the closed Scotiabank chequing:
#   BMO|••1234|<statement period end>|<line n>
# Sound only because an issued statement of a closed account never changes. Rows are numbered
# in printed order, which a fixed file cannot reorder.
scheme = "statement-line/1"
immutable = true

# The summary prints the real account as "# <transit 4> <account 3+4>". acctid is the seven
# account digits (transit dropped), so its last four are the account's own. An accounts-file
# last4 that disagrees is refused (header_last4), never silently preferred.
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # every row chains to its printed balance, and both printed total pairs tie

# Written from `fixture shape` of the real layout (2026-10-31). {AMT} and {FULL} are
# substituted before compiling.
[grammar]
amt = '-?\$?\d{1,3}(?:,\d{3})*\.\d{2}'
full_month = '(January|February|March|April|May|June|July|August|September|October|November|December)'
# "For the period ending November 22, 2021": only the end is printed.
period = 'For the period \w+ {FULL} (\d{1,2}), (\d{4})'
# Summary row under "Summary of your account": opening, deducted, added, closing. Some months
# print a marketing sidebar on the same line, right of the closing balance, after a wide gap.
summary = '^\s*# (\d{4}) (\d{4})-(\d{3})\s+({AMT})\s+({AMT})\s+({AMT})\s+({AMT})(?:\s{3,}\S.*)?\s*$'
# Every "Chequing Account # 1234 1234-567" in the text; more than one distinct account refuses.
account = 'Account # (\d{4} \d{4}-\d{3})'
# A dated line: the amounts sit in a tail after a 2+ space gap.
txn = '^(?P<mon>[A-Z][a-z]{2}) (?P<day>\d{1,2})\s+(?P<desc>\S.*?)(?P<tail>(?:\s{2,}{AMT})+)\s*$'
# The transaction-list heading; its column positions move from page to page.
header = '^Date\s+Description\s.*Balance \(\$\)'
wd_col = 'from your account \(\$\)'
dep_col = 'to your account \(\$\)'
bal_col = 'Balance \(\$\)'
opening_row = 'Opening balance'
closing_row = 'Closing totals'
