# Desjardins Visa (credit card), monthly PDF statement from AccèsD. AccèsD offers no QFX/CSV
# for cards (measured 2026-10-31), so the PDF text layer is the source.
institution = "Desjardins"
format = "pdftext"
description = "Desjardins Visa monthly PDF statement (English layout)"

[identify]
text = ['VISA DESJARDINS', 'STATEMENT DATE\s+Day\s+\d{2}\s+Month\s+\d{2}\s+Year\s+\d{4}',
        'REGULAR TRANSACTION SUMMARY']

[keys]
# No FITID. Content key, operator-approved 2026-10-31, with the frozen Desjardins normaliser:
#   Desjardins|••card|<posting date>|<amount 2dp, ledger sign>|<text>|<n>
scheme = "content-occurrence/legacy-collapse-v0"

# The header prints the ACCOUNT number, whose last four differ from the card on screen. The
# consumer's accounts file maps it to the card's last four, the same value on every run.
[account]
require_override = true

[reconcile]
minimum = "proven"
proves = true   # every row is tied to the printed summary, section total and balance

# The agentic-ledger pdf_rows_desjardins.py grammar (2026-10-31), unchanged. {AMT} is
# substituted before compiling.   /   are the no-break spaces of French amounts.
[grammar]
amt = '\d{1,3}(?:[ ,  ]\d{3})*[.,]\d{2}'
txn = '^\s*(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(?P<desc>\S.*?)\s+(?:(?P<cb>\d+(?:[.,]\d+)?\s?%)\s+)?(?P<amt>{AMT})\s*(?P<cr>CR|-)?\s*$'
fx = '^\s{20,}(\d[\d,.]*\s+[A-Z][A-Z ]+?DOLLAR\b.*|\d[\d,.]*\s+[A-Z]{3}\b.*XRT.*)$'
stmt_date = 'STATEMENT DATE\s+Day\s+(\d{2})\s+Month\s+(\d{2})\s+Year\s+(\d{4})'
account = 'Account Number\s*\n.*?\d{4} ?\d{2}\*\* ?\*{4} ?(\d{4})'
total = '^\s+Total\s+({AMT})\s*(CR|-)?\s*$'
section_regular = 'REGULAR TRANSACTION DETAILS|DÉTAIL DES TRANSACTIONS'
section_operations = '^\s*Account Operations|Opérations au compte'
# The Accord D financing tables (summary, plan details and their own ACCOUNT OPERATIONS) are a
# separate balance: the regular balance carries only the instalment. A plan's first statement
# prints the disbursement there, and a principal prepayment prints there as a CR; both look
# like card rows. The heading is anchored at line start because the regular pages carry
# "See Accord D financing transaction summary" mid-line, which must not end a section.
section_done = 'CASH BACK EARNED|REMISE EN ARGENT|^\s*ACCORD D FINANCING (?:TRANSACTION SUMMARY|TRANSACTION DETAILS|ACCOUNT OPERATIONS)\s*$'
# An Account Operations debit that the bank books under Purchases / Debits rather than Credit
# Charges: the PAYMENT ADJUSTMENT that moves a payment onto the Accord D balance (2021). A
# narrow allowlist: any other operations debit still has to tie to Credit Charges.
ops_purchase = '^PAYMENT ADJUSTMENT$'
# The 2021 print adds a 3-digit "Transaction Number" column after the posting date. It is
# only parsed where the column header says so (`numbered`), so the 2022+ grammar above,
# whose keys are frozen, never sees this variant. The number is a per-statement sequence,
# not an id: it is kept out of the description (and so out of the key).
numbered = '^\s*Transaction Date\s+Posting Date\s+Transaction\s*$'
txn_numbered = '^\s*(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+\d{3}\s+(?P<desc>\S.*?)\s+(?:(?P<cb>\d+(?:[.,]\d+)?\s?%)\s+)?(?P<amt>{AMT})\s*(?P<cr>CR|-)?\s*$'

[grammar.summary]
previous = 'Previous Balance|Solde précédent'
purchases = 'Purchases / Debits|Achats / débits'
cash_advances = 'Cash Advances|Avances de fonds'
# 2021 prints two lines, "(Interest on Purchases)" and "(Interest on Cash Advances)". The
# optional group can only match where the 2022+ wording did not (it needs "(" right after),
# so the first-match position on those statements is unchanged.
charges = 'Credit Charges(?: \(Interest on Purchases\))?|Frais de crédit'
charges_cash = 'Credit Charges \(Interest on Cash Advances\)'
instalment = 'Accord D financing Instalment|Versement Accord D'
credits = 'Payments / Credits|Paiements / crédits'
new = 'New Regular Balance|Nouveau solde régulier'
