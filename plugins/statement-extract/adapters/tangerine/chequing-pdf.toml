# Tangerine chequing, monthly PDF statement. The QFX export (tangerine/qfx) covers the same
# account; the PDF is the document of record and prints its own running balance.
institution = "Tangerine"
format = "pdftext"
description = "Tangerine chequing account, monthly PDF statement"

[identify]
# Measured 2026-10-31 on the two real statements (fixture shape): only Tangerine prints the
# "The Details - <product> - <account>" heading over a four-column Date/Description/Amount/
# Balance table, under a "Month D, YYYY To Month D, YYYY" period line.
text = ['The Details - Tangerine Chequing Account - \d+',
        'Transaction Date\s+Transaction Description\s+Amount\(\$\)\s+Balance\(\$\)',
        '[A-Z][a-z]+ \d{1,2}, \d{4} To [A-Z][a-z]+ \d{1,2}, \d{4}']

[keys]
# No FITID in the PDF. Content key: Tangerine|••1234|<date>|<amount 2dp>|<text>|<n>.
scheme = "content-occurrence/1"

# The summary table and the Details heading print the real account number; an accounts-file
# last4 that disagrees with it is refused (header_last4), never silently preferred.
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # every row prints a balance, and its sign is whichever one makes it chain

# {AMT} and {FULL} are substituted before compiling.
[grammar]
amt = '-?\$?\d{1,3}(?:,\d{3})*\.\d{2}'
full_month = '(January|February|March|April|May|June|July|August|September|October|November|December)'
period = '{FULL} (\d{1,2}), (\d{4}) To {FULL} (\d{1,2}), (\d{4})'
# Summary table: "Tangerine Chequing Account   <number>   <balance>".
summary = '^\s*Tangerine Chequing Account\s{2,}(\d{4,})\s{2,}({AMT})\s*$'
details = 'The Details - (.+?) - (\d{4,})'
# The column heading row repeats on every page, at that page's own offsets.
header = 'Transaction Date\s+Transaction Description\s+Amount\(\$\)\s+Balance\(\$\)'
# A date line. Its description cell is EMPTY when the description has an even number of
# lines: pdftotext centres the date between them.
date_line = '^\s*\d{1,2} [A-Z][a-z]{2} \d{4}\b'
txn = '^\s*(?P<day>\d{1,2}) (?P<mon>[A-Z][a-z]{2}) (?P<year>\d{4})(?P<desc>.*?)\s{2,}(?P<a1>{AMT})(?:\s{2,}(?P<a2>{AMT}))?\s*$'
page = '^\s*Page \d+ of \d+\s*$'

[grammar.columns]
date = 'Transaction Date'
desc = 'Transaction Description'
amount = 'Amount\(\$\)'
balance = 'Balance\(\$\)'
