# TD Canada Trust, EasyWeb "Intuit Quicken" download (QFX). One file may hold every account.
institution = "TD"   # the key prefix: frozen, it is inside every stored key
format = "ofx"
description = "TD EasyWeb QFX: chequing, line of credit, credit card"

# TD EasyWeb (2026-10-31): an empty <ACCTTYPE>, and the LOC wrapped as <STMTTRNRS> inside
# CREDITCARDMSGSRSV1 but closed as </CCSTMTTRNRS>.
repairs = ["empty-accttype", "cc-stmttrnrs-wrapper"]

[identify]
org = ["SYNTH-TD"]

[keys]
scheme = "fitid"   # chequing and LOC FITIDs re-matched 41/41 across exports

[reconcile]
minimum = "structural"
