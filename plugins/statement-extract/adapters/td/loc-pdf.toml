# TD personal line of credit, monthly PDF statement from EasyWeb. The QFX download covers
# only recent months, so older ones come from these PDFs.
institution = "TD"
format = "pdftext"
description = "TD line of credit monthly PDF statement"

[identify]
# pdftotext splits some header words of this layout ("St at ement"), so the markers use
# tokens that come out whole. The card's terms text mentions a line of credit, but never at
# the start of a line.
# The frame rows' month can arrive split too ("M ar", "M ay": March and May statements).
text = ['^\s*Your Line of Credit', '^\s*[A-Z] ?[a-z]{2} \d{1,2}\s+OPENING BALANCE\s',
        '^\s*[A-Z] ?[a-z]{2} \d{1,2}\s+CLOSING BALANCE\s', 'Account Number: \d{4}-\d{7}',
        'INTEREST FOR THE']

[keys]
# No FITID in the PDF. Content key: TD|••1234|<date>|<amount>|<text>|<n>.
scheme = "content-occurrence/1"

# The header prints the real account number. An accounts-file last4 that disagrees with it
# is refused (header_last4).
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # the sign is printed; credits tie to the payments total, debits to the
                # advances/interest/charges total, and opening + rows = closing

# {AMT} is substituted before compiling. A payment prints negative (the balance owed falls).
[grammar]
amt = '-?\d{1,3}(?:,\d{3})*\.\d{2}'
dollar = '\$\d{1,3}(?:,\d{3})*\.\d{2}'
# The month may arrive split after its capital ("M ay"); it is re-joined before parsing.
txn = '^\s*(?P<mon>[A-Z] ?[a-z]{2}) (?P<day>\d{1,2})\s{2,}(?P<desc>\S.*?)\s{2,}(?P<amt>{AMT})\s*$'
opening = 'OPENING BALANCE'
closing = 'CLOSING BALANCE'
# "Statement Period: July 1, 2021 to July 31, 2021", with words split by the text layer:
# months are re-joined before parsing.
period = 'Period:\s*([A-Za-z][A-Za-z ]*?)\s(\d{1,2}),\s(\d{4})\s+t\s?o\s+([A-Za-z][A-Za-z ]*?)\s(\d{1,2}),\s(\d{4})'
account = 'Account Number: (\d{4}-\d{7})'
# The two direction totals: the label on one line, its amount on a later line in the same
# horizontal span (below it in older layouts, interleaved in two columns in newer ones).
payments = 'Payment\S*\s?\S?/\s?Credit'
advances = 'New Advances'
