# TD chequing (deposit account), monthly "Statement of Account" PDF from EasyWeb. The QFX
# download covers only recent months, so older months come from these PDFs.
institution = "TD"
format = "pdftext"
description = "TD chequing monthly PDF statement (Statement of Account)"

[identify]
# The card and LOC statements carry neither the Branch/Account header nor this column row.
text = ['Statement of Account', 'Branch No\.\s+Account No\.',
        'Description\s+Withdrawals\s+Deposits\s+Date\s+Balance',
        '(?i)Toronto-Dominion Bank']

[keys]
# No FITID in the PDF. Content key: TD|••1234|<date>|<amount>|<text>|<n>.
scheme = "content-occurrence/1"

# The header prints the real account number (branch + 7-digit account). An accounts-file
# last4 that disagrees with it is refused (header_last4), never silently preferred.
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # direction from the column, then every printed balance must chain, and both
                # column totals and the balance equation must tie

# {AMT} and {DATE} are substituted before compiling. A balance may carry TD's OD suffix.
[grammar]
amt = '\d{1,3}(?:,\d{3})*\.\d{2}'
date = '(?P<mon>[A-Z]{3})\s?(?P<day>\d{1,2})'
header = '^\s*Description\s+Withdrawals\s+Deposits\s+Date\s+Balance\s*$'
withdrawals = 'Withdrawals'
deposits = 'Deposits'
# The first table row: "<WORD> BALANCE", a date and a balance, no amount.
opening = '^\s*(?P<desc>[A-Z]+ BALANCE)\s{2,}{DATE}\s{2,}(?P<bal>{AMT}(?:OD)?)\s*$'
txn = '^\s*(?P<desc>\S.*?)\s{2,}(?P<amt>{AMT})\s{2,}{DATE}(?:\s{2,}(?P<bal>{AMT}(?:OD)?))?\s*$'
total = '^\s*Total\s{2,}(?P<rest>.*\S)\s*$'
period = '([A-Z]{3}) (\d{1,2})/(\d{2}) - ([A-Z]{3}) (\d{1,2})/(\d{2})'
account = 'Branch No\.\s+Account No\.[^\n]*\n(?:[^\n]*\n){0,3}?\s*\d{4}\s+(\d{4}-\d{7})\b'
