# Scotiabank business chequing (deposit account), the 2020 "Statement Of: ... Account" PDF:
# an Account Summary (count and total of debits and of credits), then Date | Description |
# Withdrawals/Debits | Deposits/Credits | Balance. Not a card (no previous balance, minimum
# payment or credit limit) and not a line of credit (no limit, no interest). A different
# account and a different print from chequing-pdf (the closed personal account). Measured on
# one real statement (2020), shape only.
institution = "Scotiabank"
format = "pdftext"
description = "Scotiabank business chequing monthly PDF statement, 2020 print (Account Summary)"

[identify]
# None of these appear in the closed-chequing, card or LOC prints, and their markers
# ("Your account number:", "Statement Period") do not appear here.
text = ['Statement Of:\s+Account Number:\s+From:\s+To:', 'Account Summary for this Period:',
        'No\. of Debits\s+Total Amount - Debits\s+No\. of Credits\s+Total Amount - Credits',
        'Withdrawals/Debits \(\$\)\s+Deposits/Credits \(\$\)\s+Balance \(\$\)',
        'Bank of Nova Scotia']

[keys]
# No FITID. Content key, as for every PDF of an account that is not known to be closed
# (statement-line/1 was approved for the closed account only):
#   Scotiabank|••1234|<date>|<amount>|<text>|<n>
scheme = "content-occurrence/1"

# The header prints the real account number. An accounts-file last4 that disagrees with it is
# refused (header_last4), never silently preferred.
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # direction from the column; every row prints a balance that must chain, and
                # the printed counts AND totals of debits and of credits must tie

# {AMT} and {DATE} are substituted before compiling. Dates are MM/DD/YYYY (measured: only that
# order puts every row inside the printed period).
[grammar]
amt = '-?\d{1,3}(?:,\d{3})*\.\d{2}-?'
date = '(?P<mon>\d{2})/(?P<day>\d{2})/(?P<year>\d{4})'
header = '^\s*Date\s+Description\s+Withdrawals/Debits \(\$\)\s+Deposits/Credits \(\$\)\s+Balance \(\$\)\s*$'
withdrawals = 'Withdrawals/Debits \(\$\)'
deposits = 'Deposits/Credits \(\$\)'
opening = '^\s*{DATE}\s+(?P<desc>BALANCE FORWARD)\s{2,}(?P<bal>{AMT})\s*$'
txn = '^\s*{DATE}\s+(?P<desc>\S.*?)\s{2,}(?P<amt>{AMT})\s{2,}(?P<bal>{AMT})\s*$'
# The summary block (printed above and again below the list): its labels, then the values.
summary = 'No\. of Debits\s+Total Amount - Debits\s+No\. of Credits\s+Total Amount - Credits\s*\n\s*(?P<nd>\d+)\s+\$(?P<td>{AMT})\s+(?P<nc>\d+)\s+\$(?P<tc>{AMT})'
period = 'From:\s+To:\s*\n[^\n]*?([A-Z][a-z]{2}) (\d{1,2}) (\d{4})\s+([A-Z][a-z]{2}) (\d{1,2}) (\d{4})'
account = 'Account Number:[^\n]*\n[^\n]*?\s(\d{5} \d{5} \d{2})\b'
