# Scotiabank Visa credit card (Momentum), monthly PDF statement. Covers both layouts measured
# 2026-10-31: 2022/2023 (indented page, full grouped card number, "Total ..." summary labels,
# "New balance =") and 2025/2026 (flush page, "dddd XXXX XXXX dddd", "Account Balance =",
# per-cardholder sections whose subtotals carry the card number).
institution = "Scotiabank"
format = "pdftext"
description = "Scotiabank Visa credit card monthly PDF statement"

[identify]
text = ['Statement Period\s+[A-Z][a-z]{2} \d{1,2}, \d{4} - [A-Z][a-z]{2} \d{1,2}, \d{4}',
        'Previous balance, [A-Z][a-z]{2} \d{1,2}/\d{2}',
        # The product title in the header column. The legal text mentions Visa cards only
        # mid-line, and the line-of-credit statement has no such title line.
        '^\s*(?:Scotia \S+\s+)?(?:VISA|Visa) .*Card\s*$']

[keys]
# No FITID, and no legacy keys to stay compatible with: the frozen content-occurrence/1 key,
#   Scotiabank|••card|<posting date>|<amount 2dp, holder sign>|<text>|<n>
scheme = "content-occurrence/1"

# The header prints the card number (in full on 2022/2023 statements, first and last four on
# 2025/2026). An accounts-file last4 that disagrees with it is refused (header_last4).
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # every row is tied to its section subtotal, the summary and the balance

[grammar]
kind = "creditcard"
amt = '-?\$?\d{1,3}(?:,\d{3})*\.\d{2}-?'
period = 'Statement Period\s+([A-Z][a-z]{2}) (\d{1,2}), (\d{4}) - ([A-Z][a-z]{2}) (\d{1,2}), (\d{4})'
account = 'Account #\s+(\d{4}(?:\s+[0-9A-Za-z*]{3,4}){2,4})'
# REF.#, TRANS. DATE, POST DATE; the description starts where this ends.
# 2023/2024 prints: a six-digit print-sequence number in the left margin can share a row's
# line (the optional leading run; a REF.# is three digits, so it is never mistaken for one),
# and a row can print its dates alone, its details and amount on the next line (the `$`).
row = '^(?:\d{5,}\s+)?\s*(?P<ref>\d{3})\s+(?P<tmon>[A-Z][a-z]{2})\s+(?P<tday>\d{1,2})\s+(?P<pmon>[A-Z][a-z]{2})\s+(?P<pday>\d{1,2})(?:\s+|$)'
# A row's amount candidates (a trailing minus is a credit). The right-hand column (summary,
# interest-rate table) shares lines with rows, so the amount is the candidate right-aligned
# under the page's AMOUNT($) heading, within `amount_slack` columns (measured: 1 to 5).
row_amount = '\$?\d{1,3}(?:,\d{3})*\.\d{2}-?(?![\d%])'
amount_heading = 'AMOUNT\(\$\)'
amount_slack = 8
# "SUBTOTAL CREDITS [- card]  $9.99 -" / "SUBTOTAL DEBITS [- card]  $9.99": magnitude only.
subtotal = '^\s*\S+ (?P<dir>CREDITS|DEBITS)\b.*?\$(?P<amt>\d{1,3}(?:,\d{3})*\.\d{2})'

[grammar.summary]
previous = 'Previous balance, [A-Z][a-z]{2} \d{1,2}/\d{2}\s+({AMT})'
interest = '(?:Total )?[Ii]nterest\s+\+\s+({AMT})'
credits = '(?:Total )?[Pp]ayments/credits\s+-\s+({AMT})'
charges = '(?:Total )?(?:[Pp]urchases|[Aa]dvances)/charges\s+\+\s+({AMT})'
# 2025+ prints "Account Balance =" in the summary (the top "New Balance" can differ by
# instalment plans, so it is not used); 2022/2023 print only "New balance =".
closing = ['Account Balance\S*\s+=\s+({AMT})', 'New balance\s+=\s+({AMT})']
