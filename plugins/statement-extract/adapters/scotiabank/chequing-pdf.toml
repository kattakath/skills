# Scotiabank chequing (deposit account), CLOSED: the portal no longer lists it, so its monthly
# PDF statements (sent from the phone app) are the only source.
institution = "Scotiabank"
format = "pdftext"
description = "Scotiabank closed chequing account, monthly PDF statement"

[identify]
text = ['Your account number:', 'Opening Balance on [A-Z][a-z]+ \d{1,2}, \d{4}',
        'Minus total withdrawals', 'Plus total deposits']

[keys]
# No FITID. Synthetic key, operator-approved 2026-10-31 for this CLOSED account only:
#   Scotiabank|••1234|<statement period end>|<line n>
# Sound only because an issued statement never changes. The same month delivered twice with
# different bytes yields the same keys and the same payloads: counted once (dup_in_run).
scheme = "statement-line/1"
immutable = true

# The header prints the real account number. An accounts-file last4 that disagrees with it is
# refused (header_last4), never silently preferred.
[account]
verify_last4 = true

[reconcile]
minimum = "proven"
proves = true   # direction comes from the running balance, and every row must chain

# The agentic-ledger pdf_rows_scotia_chequing.py grammar (2026-10-31), unchanged. {AMT} and
# {FULL} are substituted before compiling.
[grammar]
amt = '-?\$?\d{1,3}(?:,\d{3})*\.\d{2}-?'
full_month = '(January|February|March|April|May|June|July|August|September|October|November|December)'
# A page-furniture sort code (six digits, far left) can share the line with a transaction;
# some months print a marketing sidebar right of the balance column, after a wide gap.
txn = '^\s*(?:\d{6}\s{10,})?(?P<mon>[A-Z][a-z]{2})\s+(?P<day>\d{1,2})\s+(?P<desc>\S.*?)\s{2,}(?P<a1>{AMT})(?:\s+(?P<a2>{AMT}))?(?:\s{3,}[^\d\s-].*)?\s*$'
opening = 'Opening Balance on {FULL} (\d{1,2}), (\d{4})\s+({AMT})'
closing = 'Closing Balance on {FULL} (\d{1,2}), (\d{4})\s+({AMT})'
withdrawals = 'Minus total withdrawals\s+({AMT})'
deposits = 'Plus total deposits\s+({AMT})'
header = 'Your account number'
