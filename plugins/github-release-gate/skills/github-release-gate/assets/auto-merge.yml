name: auto-merge

# Arms squash auto-merge on every PR whose branch lives in this repo. A fork's
# PR is never armed: it waits for a human merge.
#
# Arming is not merging. GitHub merges once the branch's required checks pass,
# so this relies on `validate` being a required check on main. Without that,
# an armed PR merges immediately and skips the gate in front of every release.
#
# WHY AN APP TOKEN, NOT `GITHUB_TOKEN`. Auto-merge attributes the merge to
# whoever armed it, and events produced by `GITHUB_TOKEN` start no workflow runs:
# armed with it, every auto-merge lands on main silently (no `push: main` runs).
# A GitHub App installation token carries no such suppression. Needs the App
# installed on this repo, its client id in `vars.CI_BOT_CLIENT_ID` and a private
# key in `secrets.CI_BOT_APP_PRIVATE_KEY` (org-level for a whole fleet).
#
# `pull_request`, not `pull_request_target`: the job never checks out or runs PR
# code, and the fork guard means a fork's run never reaches the App-token step,
# which needs a secret a fork cannot read.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The App token carries the merge rights; the default token needs none.
permissions:
  contents: read

jobs:
  arm:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

      # Idempotent: re-arming an armed PR is a no-op, so `synchronize` re-arms a PR
      # GitHub disarmed (a conflict, a failed required check) once the fix lands.
      - uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
